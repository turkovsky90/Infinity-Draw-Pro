<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Infinity Draw</title>
    
    <link rel="manifest" href="data:application/json;base64,ewogICJuYW1lIjogIkluZmluaXR5IERyYXciLAogICJzaG9ydF9uYW1lIjogIkRyYXciLAogICJzdGFydF91cmwiOiAiLiIsCiAgImRpc3BsYXkiOiAic3RhbmRhbG9uZSIsCiAgImJhY2tncm91bmRfY29sb3IiOiAiIzEyMTIxMiIsCiAgInRoZW1lX2NvbG9yIjogIiMxMjEyMTIiLAogICJpY29ucyI6IFsKICAgIHsKICAgICAgInNyYyI6ICJodHRwczovL2ltZy5pY29uczguY29tL2ZsdWVuY3kvNTEyL3BhaW50LWJydXNoLnBuZyIsCiAgICAgICJzaXplcyI6ICI1MTJ4NTEyIiwKICAgICAgInR5cGUiOiAiaW1hZ2UvcG5nIgogICAgfQogIF0KfQ==">
    <meta name="theme-color" content="#121212">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <link rel="apple-touch-icon" href="https://icons8.com">

    <style>
        :root { --bg: #121212; --surf: #2b2930; --primary: #d0bcff; --on-surf: #e6e1e5; --border: 1px solid #444; }
        body { margin: 0; overflow: hidden; background: var(--bg); font-family: 'Roboto', sans-serif; color: var(--on-surf); touch-action: none; user-select: none; }
        
        #header { position: fixed; top: 0; left: 0; right: 0; background: #1a1a1a; display: flex; align-items: center; padding: 6px 10px; z-index: 100; height: 44px; gap: 8px; border-bottom: 1px solid #333; }
        #tabsList { display: flex; gap: 6px; overflow-x: auto; scroll-behavior: smooth; height: 100%; align-items: center; flex-grow: 1; }
        #tabsList::-webkit-scrollbar { display: none; }
        
        .tab { background: #3d3b41; padding: 0 14px; border-radius: 28px; display: flex; align-items: center; gap: 6px; border: 1.5px solid transparent; height: 42px; min-width: 100px; flex-shrink: 0; }
        .tab.active { background: var(--surf); border-color: var(--primary); }
        .tab input { background: transparent; border: none; color: white; width: 85px; font-size: 14px; outline: none; font-weight: 500; }
        .close-tab { color: #ff8a80; font-size: 20px; cursor: pointer; display: none; }
        .can-close .close-tab { display: block; }
        .add-btn { background: #3d3b41; border: none; border-radius: 22px; min-width: 44px; height: 42px; color: white; font-size: 22px; margin-right: 5px; flex-shrink: 0; }

        #menuBtn { background: transparent; border: none; color: white; font-size: 24px; padding: 0 10px; cursor: pointer; }

        #dropdownMenu { position: fixed; top: 50px; right: 10px; background: var(--surf); border-radius: 20px; border: var(--border); display: none; flex-direction: column; padding: 8px 0; z-index: 200; box-shadow: 0 8px 24px rgba(0,0,0,0.5); min-width: 180px; }
        .menu-item { padding: 12px 20px; color: white; font-size: 15px; cursor: pointer; transition: 0.2s; }
        .menu-item:active { background: #4a4458; }
        .menu-sep { height: 1px; background: #444; margin: 4px 0; }

        #toolbarContainer { position: fixed; bottom: 22px; left: 50%; transform: translateX(-50%); z-index: 100; }
        #toolbar { background: var(--surf); padding: 6px 20px; border-radius: 55px; display: flex; gap: 12px; align-items: center; border: var(--border); box-shadow: 0 8px 30px rgba(0,0,0,0.7); position: relative; }
        .tool-btn { background: none; border: none; font-size: 24px; padding: 9px; border-radius: 50%; }
        .tool-btn.active { background: #4a4458; }
        .divider { width: 1px; height: 30px; background: #444; }

        #curCol { width: 33px; height: 33px; border-radius: 50%; border: 2px solid white; transition: 0.3s; }
        #curCol.disabled { background: #444 !important; border-color: #666; opacity: 0.3; filter: grayscale(1); }

        #palette { position: absolute; bottom: 110%; right: 0; background: var(--surf); padding: 10px; border-radius: 25px; display: none; grid-template-columns: repeat(2, 1fr); gap: 10px; z-index: 210; border: var(--border); box-shadow: 0 -5px 20px rgba(0,0,0,0.5); }
        .color-dot { width: 38px; height: 38px; border-radius: 50%; border: 1px solid rgba(255,255,255,0.1); }

        #sizePreview { position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%); width: 120px; height: 120px; background: rgba(0,0,0,0.6); border-radius: 50%; display: none; align-items: center; justify-content: center; z-index: 300; border: 1px solid #555; pointer-events: none; }
        #sizeCircle { background: var(--primary); border-radius: 50%; opacity: 0.8; }

        canvas { display: block; background: #121212; }
    </style>
</head>
<body>

<div id="header">
    <div id="tabsList"></div>
    <button class="add-btn" onclick="addProj()">+</button>
    <button id="menuBtn" onclick="toggleMenu(event)">⋮</button>
</div>

<div id="dropdownMenu">
    <div class="menu-item" onclick="undo()">Undo</div>
    <div class="menu-item" onclick="redo()">Redo</div>
    <div class="menu-sep"></div>
    <div class="menu-item" onclick="save()">Save Project</div>
    <div class="menu-item" onclick="document.getElementById('fin').click()">Open File</div>
    <div class="menu-item" onclick="exportImg()">Export PNG</div>
</div>

<div id="sizePreview"><div id="sizeCircle"></div></div>
<input type="file" id="fin" style="display:none" onchange="load(this)">

<div id="toolbarContainer">
    <div id="toolbar">
        <button class="tool-btn active" id="bBrsh" onclick="setM('brush')">🖌️</button>
        <button class="tool-btn" id="bErs" onclick="setM('eraser')">🧽</button>
        <div class="divider"></div>
        <input type="range" id="size" min="2" max="120" value="10" oninput="updateSizePreview(this.value)" onchange="hideSizePreview()" style="width:90px; accent-color: var(--primary);">
        <div id="curCol" style="background:#B388FF;" onclick="togglePal()"></div>
        
        <div id="palette">
            <div class="color-dot" style="background: #FF8A80;" onclick="pick('#FF8A80')"></div>
            <div class="color-dot" style="background: #A7FFEB;" onclick="pick('#A7FFEB')"></div>
            <div class="color-dot" style="background: #80D8FF;" onclick="pick('#80D8FF')"></div>
            <div class="color-dot" style="background: #B388FF;" onclick="pick('#B388FF')"></div>
            <div class="color-dot" style="background: #FFFF8D;" onclick="pick('#FFFF8D')"></div>
            <div class="color-dot" style="background: #00E676;" onclick="pick('#00E676')"></div>
            <div class="color-dot" style="background: #FFAB40;" onclick="pick('#FFAB40')"></div>
            <div class="color-dot" style="background: #FFD180;" onclick="pick('#FFD180')"></div>
            <div class="color-dot" style="background: #F48FB1;" onclick="pick('#F48FB1')"></div>
            <div class="color-dot" style="background: #FFFFFF;" onclick="pick('#FFFFFF')"></div>
        </div>
    </div>
</div>

<canvas id="canvas"></canvas>

<script>
    if ('serviceWorker' in navigator) {
        navigator.serviceWorker.register('data:text/javascript;base64,c2VsZi5hZGRFdmVudExpc3RlbmVyKCdmZXRjaCcsIGU9Pnt9KTs=');
    }

    const canvas = document.getElementById('canvas');
    const ctx = canvas.getContext('2d');
    let projects = [{ name: 'Art 1', paths: [], redoStack: [], offset: {x:0, y:0}, scale: 1 }];
    let curIdx = 0, isDrawing = false, lastDist = 0, lastMid = null, mode = 'brush', color = '#B388FF';

    function init() {
        window.onresize = () => { canvas.width = window.innerWidth; canvas.height = window.innerHeight; draw(); };
        window.onresize(); updTabs();
        window.onclick = (e) => { 
            if (!e.target.closest('#menuBtn') && !e.target.closest('#dropdownMenu')) hideMenu();
            if (!e.target.closest('#curCol') && !e.target.closest('#palette')) document.getElementById('palette').style.display = 'none';
        };
    }

    function toggleMenu(e) { e.stopPropagation(); const m = document.getElementById('dropdownMenu'); m.style.display = m.style.display === 'flex' ? 'none' : 'flex'; }
    function hideMenu() { document.getElementById('dropdownMenu').style.display = 'none'; }

    function updateSizePreview(val) {
        const p = document.getElementById('sizePreview');
        const c = document.getElementById('sizeCircle');
        p.style.display = 'flex'; c.style.width = c.style.height = val + 'px';
    }
    function hideSizePreview() { document.getElementById('sizePreview').style.display = 'none'; }

    canvas.addEventListener('touchstart', e => {
        const p = projects[curIdx];
        const touch = e.touches[0];
        if (e.touches.length === 1) {
            isDrawing = true;
            const x = (touch.clientX - p.offset.x) / p.scale;
            const y = (touch.clientY - p.offset.y) / p.scale;
            p.paths.push({ color: mode==='eraser'?'#121212':color, width: document.getElementById('size').value / p.scale, pts: [{x, y}] });
            p.redoStack = []; hideMenu();
        } else if (e.touches.length === 2) {
            isDrawing = false;
            lastDist = Math.hypot(e.touches[0].clientX - e.touches[1].clientX, e.touches[0].clientY - e.touches[1].clientY);
            lastMid = { x: (e.touches[0].clientX + e.touches[1].clientX)/2, y: (e.touches[0].clientY + e.touches[1].clientY)/2 };
        }
    }, {passive: false});

    canvas.addEventListener('touchmove', e => {
        e.preventDefault();
        const p = projects[curIdx];
        if (isDrawing && e.touches.length === 1) {
            const touch = e.touches[0];
            p.paths[p.paths.length-1].pts.push({ x: (touch.clientX - p.offset.x) / p.scale, y: (touch.clientY - p.offset.y) / p.scale });
            draw();
        } else if (e.touches.length === 2) {
            const t1 = e.touches[0], t2 = e.touches[1];
            const dist = Math.hypot(t1.clientX - t2.clientX, t1.clientY - t2.clientY);
            const mid = { x: (t1.clientX + t2.clientX) / 2, y: (t1.clientY + t2.clientY) / 2 };
            
            p.offset.x += (mid.x - lastMid.x);
            p.offset.y += (mid.y - lastMid.y);

            if (lastDist > 0) {
                const s = dist / lastDist;
                p.offset.x = mid.x - (mid.x - p.offset.x) * s;
                p.offset.y = mid.y - (mid.y - p.offset.y) * s;
                p.scale *= s;
            }
            lastDist = dist; lastMid = mid; draw();
        }
    }, {passive: false});

    function draw() {
        const p = projects[curIdx];
        ctx.fillStyle = '#121212'; ctx.fillRect(0, 0, canvas.width, canvas.height);
        ctx.save(); ctx.translate(p.offset.x, p.offset.y); ctx.scale(p.scale, p.scale);
        p.paths.forEach(path => {
            if(path.pts.length < 1) return;
            ctx.beginPath(); ctx.strokeStyle = path.color; ctx.lineWidth = path.width; ctx.lineCap = ctx.lineJoin = 'round';
            ctx.moveTo(path.pts[0].x, path.pts[0].y);
            for(let i=1; i<path.pts.length; i++) ctx.lineTo(path.pts[i].x, path.pts[i].y);
            ctx.stroke();
        });
        ctx.restore();
    }

    function updTabs() {
        const list = document.getElementById('tabsList'); list.innerHTML = '';
        projects.forEach((p, i) => {
            const d = document.createElement('div');
            d.className = `tab ${i===curIdx?'active':''} ${projects.length>1?'can-close':''}`;
            d.onclick = () => { curIdx = i; updTabs(); draw(); };
            const inp = document.createElement('input'); inp.value = p.name;
            inp.onchange = (e) => p.name = e.target.value;
            inp.onclick = (e) => e.stopPropagation();
            const cls = document.createElement('span'); cls.className = 'close-tab'; cls.innerHTML = '×';
            cls.onclick = (e) => { e.stopPropagation(); projects.splice(i, 1); curIdx = Math.min(curIdx, projects.length-1); updTabs(); draw(); };
            d.append(inp, cls); list.appendChild(d);
        });
        scrollActiveTab();
    }

    function scrollActiveTab() {
        const activeTab = document.querySelector('.tab.active');
        if (activeTab) activeTab.scrollIntoView({ behavior: 'smooth', inline: 'center', block: 'nearest' });
    }

    function addProj(pts = [], name = null, off = {x:0, y:0}, sc = 1) {
        projects.push({ name: name || 'Art ' + (projects.length+1), paths: pts, redoStack: [], offset: off, scale: sc });
        curIdx = projects.length - 1; updTabs(); draw();
    }

    function load(el) {
        const reader = new FileReader();
        reader.onload = e => {
            const data = JSON.parse(e.target.result);
            const pths = Array.isArray(data) ? data : (data.paths || []);
            addProj(pths, data.name || 'Imported', data.offset || {x:0, y:0}, data.scale || 1);
            hideMenu(); el.value = '';
        };
        reader.readAsText(el.files);
    }

    function save() {
        const p = projects[curIdx];
        const d = JSON.stringify({ name: p.name, paths: p.paths, offset: p.offset, scale: p.scale });
        const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([d], {type:'application/json'}));
        a.download = p.name + '.json'; a.click(); hideMenu();
    }

    function setM(m) { 
        mode = m; document.getElementById('bBrsh').classList.toggle('active', m==='brush'); 
        document.getElementById('bErs').classList.toggle('active', m==='eraser'); 
        document.getElementById('curCol').className = m==='eraser' ? 'disabled' : '';
        document.getElementById('palette').style.display = 'none';
    }
    function togglePal() { if(mode==='brush'){ const p = document.getElementById('palette'); p.style.display = p.style.display === 'grid' ? 'none' : 'grid'; } }
    function pick(c) { color = c; document.getElementById('curCol').style.background = c; setM('brush'); }
    function undo() { if (projects[curIdx].paths.length) { projects[curIdx].redoStack.push(projects[curIdx].paths.pop()); draw(); } hideMenu(); }
    function redo() { if (projects[curIdx].redoStack.length) { projects[curIdx].paths.push(projects[curIdx].redoStack.pop()); draw(); } hideMenu(); }
    function exportImg() { const a = document.createElement('a'); a.href = canvas.toDataURL(); a.download = projects[curIdx].name + '.png'; a.click(); hideMenu(); }

    canvas.addEventListener('touchend', () => { isDrawing = false; lastDist = 0; });
    init();
</script>
</body>
</html>
